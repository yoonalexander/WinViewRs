[workspace]
resolver = "2"
members = [
    "crates/winview-core",
    "crates/winview-registry",
    "crates/winview-app",
]

[workspace.dependencies]
windows-registry = { version = "0.100.0", default-features = false }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
eframe = "0.37.0"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.148"
toml = { version = "0.8.19", features = ["parse", "display"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
mockall = "0.15.0"
tempfile = "3.27.0"
proptest = "1.12.0"
insta = { version = "1.44.0", features = ["json"] }
time = { version = "0.3", features = ["formatting", "serde"] }
windows = { version = "0.62.0", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[profile.dev]
opt-level = 1